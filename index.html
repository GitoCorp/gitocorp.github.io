<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitoCorp Studios · Inicio</title>
  <meta name="description" content="GitoCorp Studios · Apps iPhone cuidadas para familia, ocio y organización.">
  <meta name="theme-color" content="#050712">
  <link rel="icon" href="assets/gitocorp-mark.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/gitocorp-mark.png">

  <!-- Redirección automática a la landing principal -->
  <meta http-equiv="refresh" content="3; url=/gitocorp-studios/">

  <style>
    :root {
      --bg: #050712;
      --text: #f8fafc;
      --muted: #aeb7cd;
      --line: rgba(255,255,255,.15);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 28% 16%, rgba(139,92,246,.42), transparent 32%),
        radial-gradient(circle at 76% 62%, rgba(34,211,238,.20), transparent 34%),
        radial-gradient(circle at 50% 100%, rgba(244,63,94,.18), transparent 30%),
        #050712;
      color: var(--text);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      overflow: hidden;
    }

    .shell {
      width: min(860px, 100%);
      text-align: center;
      padding: 54px 28px;
      border: 1px solid var(--line);
      border-radius: 38px;
      background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.04));
      box-shadow: 0 40px 120px rgba(0,0,0,.42);
      backdrop-filter: blur(22px);
      position: relative;
    }

    .shell::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(139,92,246,.42), transparent 36%, rgba(34,211,238,.26));
      z-index: -1;
      opacity: .55;
    }

    .mark {
      width: 132px;
      height: 132px;
      object-fit: contain;
      margin: 0 auto 22px;
      filter: drop-shadow(0 22px 50px rgba(0,0,0,.36));
    }

    h1 {
      margin: 0;
      font-size: clamp(44px, 8vw, 88px);
      line-height: .9;
      letter-spacing: -.07em;
      font-weight: 950;
    }

    .studios {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      gap: clamp(10px, 2vw, 24px);
      font-size: clamp(18px, 3vw, 34px);
      font-weight: 850;
      letter-spacing: .22em;
    }

    .studios span:nth-child(1){color:#8b5cf6;}
    .studios span:nth-child(2){color:#2f7cff;}
    .studios span:nth-child(3){color:#22d3ee;}
    .studios span:nth-child(4){color:#22c55e;}
    .studios span:nth-child(5){color:#f59e0b;}
    .studios span:nth-child(6){color:#fb7a2f;}
    .studios span:nth-child(7){color:#f43f5e;}

    p {
      max-width: 560px;
      margin: 26px auto 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.5;
      font-weight: 650;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 34px;
      min-height: 52px;
      padding: 0 22px;
      border-radius: 999px;
      color: #fff;
      text-decoration: none;
      font-weight: 900;
      background: linear-gradient(135deg, #8b5cf6, #22d3ee);
      box-shadow: 0 18px 40px rgba(34,211,238,.18);
    }

    .note {
      margin-top: 22px;
      font-size: 13px;
      color: rgba(219,227,244,.62);
    }
  </style>

  <script>
    window.setTimeout(function () {
      window.location.href = "/gitocorp-studios/";
    }, 3000);
  </script>
</head>
<body>
  <main class="shell" aria-label="GitoCorp Studios">
    <img class="mark" src="assets/gitocorp-mark.png" alt="GitoCorp Studios">
    <h1>GitoCorp</h1>
    <div class="studios" aria-label="Studios">
      <span>S</span><span>T</span><span>U</span><span>D</span><span>I</span><span>O</span><span>S</span>
    </div>
    <p>Apps iPhone cuidadas para jugar, organizar y crear experiencias con personalidad.</p>
    <a class="button" href="/gitocorp-studios/">Entrar en GitoCorp Studios</a>
    <div class="note">Redirigiendo a la landing principal…</div>
  </main>
</body>
</html>
